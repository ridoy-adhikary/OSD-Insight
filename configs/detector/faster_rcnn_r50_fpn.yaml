framework: torchvision
model: fasterrcnn_resnet50_fpn
pretrained: true
# known classes in classes.yaml = 20 -> num_classes = 21 (incl. background)
num_classes: 21
device: cuda:0
batch_size: 2
num_workers: 2
lr: 0.005
momentum: 0.9
weight_decay: 0.0005
max_epochs: 12
seed: 42
dataset_root: dataset/open_images_v7
classes_yaml: dataset/open_images_v7/classes.yaml
